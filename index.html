<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PontoWeb Unespar</title>
    
    <!-- DETEÇÃO DE DISPOSITIVO E REDIRECIONAMENTO DE SEGURANÇA -->
    <script>
      (function() {
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isIPadOS = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const isSmallScreen = window.innerWidth <= 1024;
        const isMobile = isMobileUA || isIPadOS || (isTouchDevice && isSmallScreen);

        if (!isMobile) {
          window.location.replace("index_pc.html" + window.location.search);
        }
      })();
    </script>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#166534">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://github.com/sistemas-luiz/pontoaurora/blob/main/Icone.png?raw=true">
    <link rel="icon" type="image/png" href="https://github.com/sistemas-luiz/pontoaurora/blob/main/Icone.png?raw=true">

    <!-- Dependências -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <style>
      body { background-color: #ffffff; color: #1f2937; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
      .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .scale-click:active { transform: scale(0.96); transition: transform 0.1s; }
      .spinner { border: 3px solid #e5e7eb; width: 24px; height: 24px; border-radius: 50%; border-left-color: #16a34a; animation: spin 0.8s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- SHIM -->
    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycby3AyDbEbz212PWpPy9Jih5yEDEMoIKIU2QJD0_gnFEC_m7NAnsw5T4uXE228v_sgUs/exec";

      const ExternalBridge = {
        request: async (action, payload = {}) => {
          const response = await fetch(API_URL, {
            method: 'POST',
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action, ...payload })
          });
          return await response.json();
        }
      };

      if (typeof google === 'undefined') {
        const createShim = (successFn, failureFn) => {
          const execute = (action, params) => {
            ExternalBridge.request(action, params)
              .then(res => { if (successFn) successFn(res); })
              .catch(err => { if (failureFn) failureFn(err); });
          };
          return {
            withSuccessHandler: (fn) => createShim(fn, failureFn),
            withFailureHandler: (fn) => createShim(successFn, fn),
            getBolsistaInfo: (id, token) => execute('getBolsistaInfo', { id, token }),
            registrarPonto: (p) => execute('registrarPonto', p),
            salvarToken: (p) => execute('salvarToken', p),
            salvarConfiguracao: (p) => execute('salvarConfiguracao', p),
            salvarEscalaUsuario: (p) => execute('salvarEscalaUsuario', p)
          };
        };
        window.google = { script: { run: createShim(null, null), url: { getLocation: (cb) => { cb({ parameter: {} }); } } } };
      }
    </script>

    <!-- LÓGICA DA APLICAÇÃO REACT -->
    <script type="text/plain" id="react-app">
      const { useState, useEffect, useRef } = React;
      
      const CACHE_KEY_AUTH = 'ponto_auth_data_v2';
      const CACHE_KEY_DATA = 'pontoweb_user_data_cache';

      const LucideIcon = ({ name, size = 18, className = "" }) => {
        const ref = useRef(null);
        useEffect(() => {
          if (ref.current) {
            lucide.createIcons({
              root: ref.current,
              nameAttr: 'data-lucide',
              attrs: { class: className }
            });
          }
        }, [name, size, className]);
        return <span ref={ref} dangerouslySetInnerHTML={{ __html: `<i data-lucide="${name}" width="${size}" height="${size}"></i>` }} style={{ display: 'inline-flex', alignItems: 'center' }} />;
      };

      // Modal customizado para substituir alertas
      const NotificationAlert = ({ title, message, onClose }) => {
        if (!message) return null;
        return (
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
             <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-xs text-center border">
                <h3 className="font-bold text-lg mb-2 text-gray-800">{title || "Aviso"}</h3>
                <p className="text-gray-500 text-sm mb-6">{message}</p>
                <button onClick={onClose} className="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl scale-click">Entendi</button>
             </div>
          </div>
        );
      };

      // Modal de Escala Semanal de Trabalho (Inclusão de Intervalos)
      const ScheduleSetupModal = ({ isOpen, onClose, userEscala, onSave, loading }) => {
        const [escala, setEscala] = useState({});

        useEffect(() => {
          if (userEscala) setEscala(userEscala);
        }, [userEscala]);

        const updateDay = (day, field, val) => {
          setEscala(prev => ({
             ...prev,
             [day]: {
               ...(prev[day] || { entrada: '', saida: '', intInicio: '', intFim: '' }),
               [field]: val
             }
          }));
        };

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[90] flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in">
             <div className="bg-white rounded-t-[2rem] sm:rounded-2xl w-full max-w-md h-[85vh] sm:h-auto overflow-y-auto p-6 flex flex-col justify-between border">
                <div>
                   <div className="flex justify-between items-center mb-4">
                      <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2"><LucideIcon name="calendar-days" /> Definir Escala Semanal</h3>
                      <button onClick={onClose} className="text-gray-400 p-1"><LucideIcon name="x" /></button>
                   </div>
                   <p className="text-xs text-gray-400 mb-4">Defina o seu horário de trabalho e intervalo para cada dia.</p>
                   
                   <div className="space-y-3">
                     {['Seg', 'Ter', 'Qua', 'Qui', 'Sex'].map(day => {
                        const dayLabel = {Seg: 'Segunda', Ter: 'Terça', Qua: 'Quarta', Qui: 'Quinta', Sex: 'Sexta'}[day];
                        const dayData = escala[day] || { entrada: '', saida: '', intInicio: '', intFim: '' };
                        return (
                          <div key={day} className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                             <div className="font-bold text-xs text-gray-700 mb-2">{dayLabel}</div>
                             <div className="grid grid-cols-2 gap-2 text-[10px]">
                               <div>
                                  <label className="text-gray-400">Jornada</label>
                                  <div className="flex items-center gap-1 mt-1">
                                    <input type="time" value={dayData.entrada} onChange={e => updateDay(day, 'entrada', e.target.value)} className="border p-1 bg-white rounded text-center w-full" />
                                    <span>às</span>
                                    <input type="time" value={dayData.saida} onChange={e => updateDay(day, 'saida', e.target.value)} className="border p-1 bg-white rounded text-center w-full" />
                                  </div>
                               </div>
                               <div>
                                  <label className="text-gray-400">Intervalo</label>
                                  <div className="flex items-center gap-1 mt-1">
                                    <input type="time" value={dayData.intInicio} onChange={e => updateDay(day, 'intInicio', e.target.value)} className="border p-1 bg-white rounded text-center w-full" />
                                    <span>às</span>
                                    <input type="time" value={dayData.intFim} onChange={e => updateDay(day, 'intFim', e.target.value)} className="border p-1 bg-white rounded text-center w-full" />
                                  </div>
                               </div>
                             </div>
                          </div>
                        );
                     })}
                   </div>
                </div>

                <div className="mt-6 flex gap-3">
                   <button onClick={onClose} className="flex-1 py-3 bg-gray-100 rounded-xl text-gray-600 font-bold text-xs">Cancelar</button>
                   <button onClick={() => onSave(escala)} disabled={loading} className="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold text-xs flex justify-center items-center gap-2 scale-click">
                      {loading ? <div className="spinner w-4 h-4 border-2"></div> : 'Salvar Escala'}
                   </button>
                </div>
             </div>
          </div>
        );
      };

      function TimeClock() {
        const [authData] = useState(() => JSON.parse(localStorage.getItem(CACHE_KEY_AUTH) || 'null'));
        const [cachedData] = useState(() => JSON.parse(localStorage.getItem(CACHE_KEY_DATA) || 'null'));

        const [params, setParams] = useState(authData);
        const [bolsistaName, setBolsistaName] = useState(cachedData?.nome || '');
        const [lastAction, setLastAction] = useState(cachedData?.lastAction || null);
        const [entryTime, setEntryTime] = useState(cachedData?.entryTime || null);
        const [exitTime, setExitTime] = useState(cachedData?.exitTime || null);
        
        const [entradaToday, setEntradaToday] = useState(cachedData?.entradaToday || null);
        const [saidaToday, setSaidaToday] = useState(cachedData?.saidaToday || null);
        const [intervaloInicioToday, setIntervaloInicioToday] = useState(cachedData?.intervaloInicioToday || null);
        const [intervaloFimToday, setIntervaloFimToday] = useState(cachedData?.intervaloFimToday || null);
        const [escalaSemanal, setEscalaSemanal] = useState(cachedData?.escalaSemanal || null);

        const [location, setLocation] = useState(null);
        const [status, setStatus] = useState(cachedData ? 'ready' : 'loading');
        
        const [punchType, setPunchType] = useState(null);
        const [result, setResult] = useState(null);
        const [inputUrl, setInputUrl] = useState('');
        const [currentTime, setCurrentTime] = useState(new Date()); 
        
        const [showScheduleModal, setShowScheduleModal] = useState(false);
        const [saveLoading, setSaveLoading] = useState(false);
        const [alertMessage, setAlertMessage] = useState(null);
        const [alertTitle, setAlertTitle] = useState(null);

        const videoRef = useRef(null);

        const showAlert = (title, msg) => {
           setAlertTitle(title);
           setAlertMessage(msg);
        };

        useEffect(() => { const t=setInterval(()=>setCurrentTime(new Date()),1000); return ()=>clearInterval(t); }, []);

        useEffect(() => {
          const u=new URLSearchParams(window.location.search);
          const uid=u.get('id'), ut=u.get('token');
          if(uid && ut) { 
             saveAndLogin(uid, ut); 
          } else if (params) {
             loadBolsistaBackground(params.id, params.token);
             initGPS();
          } else {
             setStatus('waiting_link');
          }
        }, []);

        const saveAndLogin = (id, token) => {
           const auth = {id,token};
           localStorage.setItem(CACHE_KEY_AUTH, JSON.stringify(auth));
           setParams(auth);
           setStatus('loading');
           loadBolsistaBackground(id,token);
           initGPS();
        };

        const handleManualLogin = (e) => {
           e.preventDefault(); if(!inputUrl) return;
           try {
             if(inputUrl.includes('?')) {
                const u=new URL(inputUrl.startsWith('http')?inputUrl:`http://d.com/${inputUrl}`);
                const p=new URLSearchParams(u.search);
                const id=p.get('id'), token=p.get('token');
                if(id&&token) saveAndLogin(id,token); else showAlert("Aviso", "Link inválido.");
             } else throw new Error();
           } catch(err) { showAlert("Aviso", "Link inválido."); }
        };

        const loadBolsistaBackground = (id, token) => {
           if(navigator.onLine) {
             google.script.run.withSuccessHandler(res => {
               if(res.error) { 
                 if(!cachedData) { showAlert("Erro", res.error); localStorage.removeItem(CACHE_KEY_AUTH); setStatus('waiting_link'); }
               } else {
                 localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(res));
                 applyUserData(res);
                 setStatus('ready');
               }
             }).withFailureHandler(err => { 
                if(!cachedData) { showAlert("Erro", "Erro de ligação."); setStatus('waiting_link'); }
             }).getBolsistaInfo(id,token);
           } else if(!cachedData) {
             setStatus('error-offline');
           }
        };

        const applyUserData = (data) => {
           setBolsistaName(data.nome||''); 
           setEntryTime(data.entryTime||null); 
           setExitTime(data.exitTime||null); 
           setLastAction(data.lastAction||null);
           setEntradaToday(data.entradaToday||null); 
           setSaidaToday(data.saidaToday||null);
           setIntervaloInicioToday(data.intervaloInicioToday||null);
           setIntervaloFimToday(data.intervaloFimToday||null);
           setEscalaSemanal(data.escalaSemanal||null);
        };

        const initGPS = () => { if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>setLocation(p.coords),()=>console.warn('GPS pendente'),{enableHighAccuracy:true}); };
        const resetState = () => { setResult(null); setPunchType(null); setStatus('ready'); if (params) loadBolsistaBackground(params.id, params.token); };
        
        const startCamera = async (type) => { 
          setPunchType(type); 
          setStatus('punching'); 
          try { 
             const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); 
             if(videoRef.current) videoRef.current.srcObject=s; 
          } catch(e) { 
             showAlert('Câmara Bloqueada', 'Por favor, conceda permissão de acesso à câmara.'); 
             setStatus('ready'); 
          } 
        };
        
        const confirm = () => {
          if(!navigator.onLine) { showAlert("Aviso", "Sem acesso à internet."); setStatus('ready'); return; }
          const cvs=document.createElement('canvas'); cvs.width=320; cvs.height=240; const ctx=cvs.getContext('2d');
          if(videoRef.current) { ctx.translate(320,0); ctx.scale(-1,1); ctx.drawImage(videoRef.current,0,0,320,240); const s=videoRef.current.srcObject; if(s) s.getTracks().forEach(t=>t.stop()); }
          const foto=cvs.toDataURL('image/jpeg',0.7); setStatus('sending');
          const pl={pessoaId:params.id, token:params.token, tipo:punchType, lat:location?location.latitude:'', lng:location?location.longitude:'', prec:location?location.accuracy:'', fotoBase64:foto};
          
          google.script.run.withSuccessHandler(res => { 
             if(res.ok) { 
               setResult(res); setStatus('success'); 
               const c=JSON.parse(localStorage.getItem(CACHE_KEY_DATA)||'{}'); 
               c.lastAction=punchType;
               if(punchType==='Entrada') c.entryTime=res.timestamp.split(' ')[1].substring(0,5);
               if(punchType==='Saida') c.exitTime=res.timestamp.split(' ')[1].substring(0,5);
               c.nome = bolsistaName;
               localStorage.setItem(CACHE_KEY_DATA,JSON.stringify(c)); 
               applyUserData(c);
             } else { showAlert("Erro", res.msg); setStatus('ready'); } 
          }).withFailureHandler(err => { showAlert("Erro", "Erro ao comunicar com o servidor."); setStatus('ready'); }).registrarPonto(pl);
        };

        const handleSaveSchedule = (newEscala) => {
           setSaveLoading(true);
           google.script.run.withSuccessHandler(res => {
              setSaveLoading(false);
              setShowScheduleModal(false);
              showAlert("Sucesso", "A sua escala de trabalho com intervalos foi guardada!");
              if (params) loadBolsistaBackground(params.id, params.token);
           }).withFailureHandler(err => {
              setSaveLoading(false);
              showAlert("Erro de Gravação", "Não foi possível sincronizar os horários.");
           }).salvarEscalaUsuario({ id: params.id, token: params.token, escala: newEscala });
        };

        if(status==='waiting_link') return <div className="h-screen flex items-center justify-center p-4 bg-white"><form onSubmit={handleManualLogin} className="w-full max-w-sm text-center fade-in"><div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600"><LucideIcon name="link" size={32}/></div><h1 className="text-xl font-bold mb-2 text-gray-800">Identificação</h1><p className="text-gray-500 mb-6 text-sm">Cole o seu link pessoal para aceder.</p><input value={inputUrl} onChange={e=>setInputUrl(e.target.value)} placeholder="Cole aqui..." className="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-green-500 outline-none"/><button className="bg-green-600 text-white w-full py-3 rounded-lg font-bold shadow-lg scale-click">Entrar</button></form></div>;
        if(status==='loading') return (
          <div className="h-screen flex flex-col items-center justify-center bg-white gap-4">
            <img src="https://github.com/sistemas-luiz/pontoaurora/blob/main/Logo.png?raw=true" className="w-48 h-48 animate-pulse" />
            <div className="spinner"></div>
          </div>
        );
        
        if(status==='success') return <div className="h-screen flex flex-col items-center justify-center gap-4 bg-white fade-in"><div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-green-600"><LucideIcon name="check" size={36}/></div><h2 className="text-2xl font-bold text-gray-800">Registado!</h2><p className="text-gray-500 text-lg">{result.timestamp}</p><button onClick={resetState} className="mt-8 bg-gray-100 text-gray-700 px-8 py-3 rounded-full font-bold scale-click">Voltar</button></div>;
        
        if(status==='punching') return (
          <div className="fixed inset-0 bg-black flex flex-col items-center justify-center z-50 slide-up">
            <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover scale-x-[-1]"></video>
            <div className="absolute bottom-10 w-full px-6 flex gap-4">
              <button onClick={()=>{if(videoRef.current?.srcObject) videoRef.current.srcObject.getTracks().forEach(t=>t.stop()); setStatus('ready');}} className="flex-1 bg-white py-4 rounded-xl font-bold text-gray-800 shadow-lg scale-click">Cancelar</button>
              <button onClick={confirm} className="flex-1 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 scale-click"><LucideIcon name="camera" /> Confirmar</button>
            </div>
          </div>
        );

        const isWorking = lastAction==='Entrada'||lastAction==='Intervalo-Fim';
        const onInterval = lastAction==='Intervalo-Inicio';
        const isLocationMissing = !location;

        const isEntryBlocked = isWorking || onInterval;
        const isExitBlocked = !isWorking || onInterval;
        const isIntStartBlocked = !isWorking || onInterval;
        const isIntEndBlocked = !onInterval;

        return (
          <div className="min-h-screen flex flex-col bg-white">
            <NotificationAlert title={alertTitle} message={alertMessage} onClose={() => setAlertMessage(null)} />
            
            <ScheduleSetupModal 
              isOpen={showScheduleModal} 
              onClose={() => setShowScheduleModal(false)} 
              userEscala={escalaSemanal} 
              onSave={handleSaveSchedule} 
              loading={saveLoading} 
            />

            <div className="bg-green-600 p-6 text-white text-center rounded-b-[2rem] shadow-xl relative z-10">
              <button onClick={() => setShowScheduleModal(true)} className="absolute top-5 right-5 p-2 bg-green-700/50 rounded-full hover:bg-green-500 transition-colors">
                 <LucideIcon name="calendar-days" className="text-white" />
              </button>

              <h1 className="text-2xl font-bold tracking-tight">PontoWeb</h1>
              <div className="mt-1 opacity-90 text-xs font-medium uppercase tracking-widest">Unespar</div>
              
              <div className="mt-6 mb-2">
                <span className="text-5xl font-mono font-bold tracking-tighter">{currentTime.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</span>
                <span className="text-xl font-mono opacity-85 ml-1">{currentTime.getSeconds().toString().padStart(2,'0')}</span>
              </div>
              <div className="text-sm font-medium opacity-90 mb-4">{currentTime.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' })}</div>

              <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-green-700/40 rounded-full text-xs font-medium backdrop-blur-sm">
                 <LucideIcon name="map-pin" size={14}/> {location ? 'Localização Ativa' : 'A procurar GPS...'}
              </div>
            </div>

            {status==='sending'&&<div className="absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm fade-in"><div className="spinner mb-4"></div><p className="text-green-700 font-bold animate-pulse">A gravar...</p></div>}
            
            <div className="flex-1 p-6 flex flex-col justify-center gap-4 fade-in">
              <div className="text-center mb-4">
                <p className="text-gray-400 text-xs uppercase tracking-wider mb-1">Bolsista Identificado</p>
                <h3 className="text-lg font-bold text-gray-800">{bolsistaName || 'Carregando...'}</h3>
                
                {entradaToday && saidaToday && (
                  <div className="mt-2 inline-block bg-green-50 border border-green-100 px-3 py-1 rounded-full text-green-700 text-xs font-bold leading-tight">
                     Hoje: {entradaToday} às {saidaToday} 
                     {intervaloInicioToday && intervaloFimToday && ` (Pausa: ${intervaloInicioToday} - ${intervaloFimToday})`}
                  </div>
                )}
                
                <div className="flex gap-2 justify-center mt-3">
                  {entryTime && <div className="bg-blue-50 px-4 py-1.5 rounded-lg text-blue-700 text-xs font-bold border border-blue-100">Entrada: {entryTime}</div>}
                  {exitTime && <div className="bg-orange-50 px-4 py-1.5 rounded-lg text-orange-700 text-xs font-bold border border-orange-100">Saída: {exitTime}</div>}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                 <button disabled={isEntryBlocked || isLocationMissing} onClick={()=>startCamera('Entrada')} className="col-span-1 bg-green-50 border-2 border-green-100 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-green-100 disabled:opacity-40 scale-click">
                    <div className="w-10 h-10 bg-green-200 rounded-full flex items-center justify-center text-green-700"><LucideIcon name="log-in" /></div>
                    <span className="font-bold text-green-800 text-xs">ENTRADA</span>
                 </button>
                 <button disabled={isExitBlocked || isLocationMissing} onClick={()=>startCamera('Saida')} className="col-span-1 bg-red-50 border-2 border-red-100 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-red-100 disabled:opacity-40 scale-click">
                    <div className="w-10 h-10 bg-red-200 rounded-full flex items-center justify-center text-red-700"><LucideIcon name="log-out" /></div>
                    <span className="font-bold text-red-800 text-xs">SAÍDA</span>
                 </button>
              </div>

              <div className="grid grid-cols-2 gap-4 mt-2">
                <button disabled={isIntStartBlocked || isLocationMissing} onClick={()=>startCamera('Intervalo-Inicio')} className="bg-white border p-3 rounded-xl font-bold text-gray-600 text-xs hover:bg-gray-50 scale-click disabled:opacity-50">Início Interv.</button>
                <button disabled={isIntEndBlocked || isLocationMissing} onClick={()=>startCamera('Intervalo-Fim')} className="bg-white border p-3 rounded-xl font-bold text-gray-600 text-xs hover:bg-gray-50 scale-click disabled:opacity-50">Fim Interv.</button>
              </div>
            </div>
          </div>
        );
      }

      function LandingPage({ onOpenWeb }) {
        return (
          <div className="min-h-screen bg-white flex flex-col items-center justify-center p-6 text-center fade-in relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-64 bg-green-600 rounded-b-[3rem] -z-10"></div>
            <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-xl mb-6 z-10"><img src="https://github.com/sistemas-luiz/pontoaurora/blob/main/Logo.png?raw=true" className="w-14 h-14"/></div>
            
            <h1 className="text-3xl font-bold text-gray-800 mb-2">PontoWeb</h1>
            <p className="text-gray-500 mb-8 max-w-xs text-sm">Registro de ponto com conformidade de horários e intervalos semanais flexíveis.</p>

            <div className="w-full max-w-sm space-y-3 mb-8">
               <button onClick={onOpenWeb} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-md shadow-lg flex items-center justify-center gap-2 hover:bg-green-700 active:scale-95 transition-all">
                  Aceder ao Sistema
               </button>
            </div>
          </div>
        );
      }

      function Main() {
        const [mode, setMode] = useState(() => {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
          const hasParams = new URLSearchParams(window.location.search).has('id');
          const hasCache = !!localStorage.getItem(CACHE_KEY_AUTH);
          if (isStandalone || hasParams || hasCache) return 'app';
          return 'landing';
        });

        return mode === 'app' ? <TimeClock /> : <LandingPage onOpenWeb={() => setMode('app')} />;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Main />);
    </script>

    <!-- Transpiler Bootstrapper -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        try {
          const reactAppEl = document.getElementById('react-app');
          if (reactAppEl) {
            const rawCode = reactAppEl.textContent;
            const compiledCode = Babel.transform(rawCode, { presets: [['react', { runtime: 'classic' }]] }).code;
            const executeApp = new Function(compiledCode);
            executeApp();
          }
        } catch (err) {
          console.error("React Fallback:", err);
        }
      });
    </script>
  </body>
</html>
